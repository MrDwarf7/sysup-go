name: "Draft"
on:
  push:
    branches:
      - "master"
      - "main"
    tags: ["v[0-9]+.[0-9]+.[0-9]?"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITHUB_BRANCH_TAG_NAME: "${{ github.ref_name }}"
  PROJECT_NAME: "sysup-go"

jobs:
  build-unix:
    name: "Draft - build-unix"
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Go"
        uses: "./.github/actions/setup-go"
        with:
          install-mingw: "false"

      - name: "Build"
        shell: "bash"
        run: |
          export ARTIFACT_NAME="${{ env.PROJECT_NAME }}-x86_64-unknown-linux-gnu-${{ env.GITHUB_BRANCH_TAG_NAME }}"
          just br
          mkdir -p "${ARTIFACT_NAME}"
          cp bin/sysup "${ARTIFACT_NAME}/sysup"
          cp README.md LICENSE "${ARTIFACT_NAME}/" 2>/dev/null || true
          cd "${ARTIFACT_NAME}"
          zip -r "../${ARTIFACT_NAME}.zip" .
          cd ..

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "${{ env.PROJECT_NAME }}-x86_64-unknown-linux-gnu-${{ env.GITHUB_BRANCH_TAG_NAME }}"
          path: "${{ env.PROJECT_NAME }}-x86_64-unknown-linux-gnu-${{ env.GITHUB_BRANCH_TAG_NAME }}.zip"
          if-no-files-found: "error"
          compression-level: 9

  build-windows:
    name: "Draft - build-windows"
    strategy:
      matrix:
        include:
          - os: "windows-latest"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Go"
        uses: "./.github/actions/setup-go"
        with:
          install-mingw: "false"

      - name: "Build"
        shell: "bash"
        run: "just br"

      - name: "Pack artifact"
        shell: "powershell"
        working-directory: "${{ github.workspace }}"
        run: |
          $ARTIFACT_NAME="${{ env.PROJECT_NAME }}-x86_64-pc-windows-msvc-${{ env.GITHUB_BRANCH_TAG_NAME }}"
          New-Item -ItemType Directory -Path "$ARTIFACT_NAME"
          $bin = if (Test-Path "bin/sysup.exe") { "bin/sysup.exe" } else { "bin/sysup" }
          Copy-Item -Path $bin -Destination "$ARTIFACT_NAME/sysup.exe"
          Copy-Item -Path "README.md","LICENSE" -Destination "$ARTIFACT_NAME" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$ARTIFACT_NAME\\*" -Destination "$ARTIFACT_NAME.zip"

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "${{ env.PROJECT_NAME }}-x86_64-pc-windows-msvc-${{ env.GITHUB_BRANCH_TAG_NAME }}"
          path: "${{ env.PROJECT_NAME }}-x86_64-pc-windows-msvc-${{ env.GITHUB_BRANCH_TAG_NAME }}.zip"
          if-no-files-found: "error"
          compression-level: 9

  draft:
    name: "Draft - draft"
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: [build-unix, build-windows]
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Download artifacts"
        uses: "actions/download-artifact@v8"
        with:
          merge-multiple: true

      - name: "Draft"
        uses: "softprops/action-gh-release@v3"
        with:
          fail_on_unmatched_files: true
          draft: true
          files: "${{ env.PROJECT_NAME }}-*"
          generate_release_notes: true

  nightly:
    name: "Draft - nightly"
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: [build-unix, build-windows]
    steps:
      - name: "Generate nightly body"
        run: |
          echo 'NIGHTLY_BODY<<EOF' >> $GITHUB_ENV
          echo "From commit: ${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "Generated on: $(date -u +\"%Y-%m-%d %H:%M\") UTC" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Download artifacts"
        uses: "actions/download-artifact@v8"
        with:
          merge-multiple: true

      - name: "Drop existing nightly release and tag"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" 2>/dev/null || true

      - name: "Release Nightly"
        uses: "softprops/action-gh-release@v3"
        with:
          tag_name: "nightly"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: "${{ env.PROJECT_NAME }}-*"
          name: "Nightly Build"
          body: "${{ env.NIGHTLY_BODY }}"
          target_commitish: "${{ github.sha }}"
