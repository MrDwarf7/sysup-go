name: "Docs - Check & Generation"
on:
  push:
    branches:
      - "master"
      - "main"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJECT_NAME: "sysup-go"

jobs:
  docs:
    name: "Docs - check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Go"
        uses: "./.github/actions/setup-go"
        with:
          install-mingw: "false"

      - name: "Packages list"
        shell: "bash"
        run: "go list ./..."

      - name: "Index exists"
        shell: "bash"
        run: "test -f docs/INDEX.md"

  package-docs:
    name: "Docs - package"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Zip docs"
        shell: "bash"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          zip -r "${{ env.PROJECT_NAME }}-docs.zip" docs AGENTS.md LICENSE

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "${{ env.PROJECT_NAME }}-docs.zip"
          path: "${{ env.PROJECT_NAME }}-docs.zip"
          if-no-files-found: "error"
          compression-level: 9
          overwrite: true

  publish-docs:
    name: "Docs - publish-docs"
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: [package-docs]
    steps:
      - name: "Generate docs body"
        run: |
          echo 'DOCS_BODY<<EOF' >> $GITHUB_ENV
          echo "From commit: ${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "Generated on: $(date -u +\"%Y-%m-%d %H:%M\") UTC" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Download artifacts"
        uses: "actions/download-artifact@v8"
        with:
          merge-multiple: true

      - name: "Drop existing docs release and tag"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release delete docs --yes --cleanup-tag 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/docs" 2>/dev/null || true

      - name: "Docs - draft"
        uses: "softprops/action-gh-release@v3"
        with:
          tag_name: "docs"
          fail_on_unmatched_files: true
          draft: true
          make_latest: false
          files: "${{ env.PROJECT_NAME }}-docs.zip"
          name: "[${{ github.ref_name }} Docs]"
          body: "${{ env.DOCS_BODY }}"
          target_commitish: "${{ github.sha }}"
          generate_release_notes: false
