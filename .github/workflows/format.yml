name: "Formatting"
on:
  push:
    branches:
      - "master"
      - "main"
      - "develop"
      - "dev"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJECT_NAME: "sysup-go"

jobs:
  format-lint:
    name: "Formatting - ${{ matrix.os }}"
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
          - os: "windows-latest"
    runs-on: "${{ matrix.os }}"
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Go"
        uses: "./.github/actions/setup-go"
        with:
          install-mingw: "false"

      - name: "gofmt check"
        shell: "bash"
        run: "just format-check"

      - name: "Release build"
        shell: "bash"
        run: "just br"
