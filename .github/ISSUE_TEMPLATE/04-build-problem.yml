name: Build Problem
description: Report a problem with building from source
title: "[BUILD]: "
labels: [build-problem]
assignees: []
body:
  - type: textarea
    id: "description"
    validations:
      required: true
    attributes:
      label: "Describe the Build Problem"
      description: "A clear and concise description of the build issue you are encountering."
      placeholder: "ex: When trying to build the program, I encountered the following issue:\n"
  - type: dropdown
    id: "os"
    validations:
      required: true
    attributes:
      label: "Operating System"
      description: "Please select your operating system."
      options:
        - Windows
        - Linux
        - macOS
        - Other (mention in description)
  - type: input
    id: "distro"
    validations:
      required: false
    attributes:
      label: "Linux Distribution (if applicable)"
      description: "If you selected Linux above, please specify your distribution (e.g., Ubuntu 22.04, Fedora 38)."
      placeholder: "ex: Ubuntu 22.04"
      value: "N/A"
  - type: dropdown
    id: "arch"
    validations:
      required: true
    attributes:
      label: "Architecture"
      description: "Please select your system architecture."
      options:
        - x86_64
        - aarch64
        - armv7
        - Other (mention in description)
  - type: input
    id: "go-version"
    validations:
      required: true
    attributes:
      label: "Go Version"
      description: "Run `go version` and paste the output here."
      placeholder: "ex: go version go1.27.0 linux/amd64"
  - type: dropdown
    id: "recipe"
    validations:
      required: true
    attributes:
      label: "just recipe"
      description: "Which just recipe failed?"
      options:
        - "just build (debug / race)"
        - "just build-release"
        - "just build-expr"
        - "just test"
        - "just check"
        - "other"
  - type: textarea
    id: "diagnosis"
    validations:
      required: true
    attributes:
      label: "Diagnosis Attempt"
      description: |
        Please attempt to diagnose whether the build failure is with the program itself, the environment, or something else.
      placeholder: |
        ex:
        When using go1.27:
        [ ... ]
        When using go1.26:
        [ ... ]
  - type: textarea
    id: "logs"
    validations:
      required: false
    attributes:
      label: "Logs/Error Messages"
      description: "Please provide any relevant logs or error messages."
      placeholder: "Paste logs or errors here."
      value: "The error that occurred was:\n\n```\n\n```"
  - type: textarea
    id: "build_output"
    validations:
      required: false
    attributes:
      label: "Build Output (if applicable)"
      description: "If applicable, paste the build output here."
      placeholder: "Paste build output here."
      value: "The build output showed as:\n```\n\n```"
